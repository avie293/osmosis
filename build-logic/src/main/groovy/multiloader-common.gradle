plugins {
    id 'java-library'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-${project.name}"
}

repositories {
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = java_version as int
}

tasks.withType(Jar).configureEach {
    def modId = mod_id
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${modId}" }
    }
}

processResources {
    var props = [
            version                : version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_author             : mod_author,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_homepage           : mod_homepage,
            mod_sources            : mod_sources,
            mod_issues             : mod_issues,
            java_version           : java_version,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version  : fabric_loader_version,
            neoforge_version       : neoforge_version,
            forge_version          : forge_version,
            forge_loader_version   : forge_loader_version,
    ]
    inputs.properties props

    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
        expand props
    }
}
