# Every property used in resources must also be added to the props map in
# build-logic/src/main/groovy/multiloader-common.gradle.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=osmosis
mod_name=Osmosis
mod_version=1.0.0
mod_group=cc.avie.osmosis
mod_author=Avie
mod_description=A friends list with encrypted chat and easy world hosting through invites and one-click joining.
mod_license=Avie Terms & Conditions 1.0
mod_homepage=https://avie.cc/
mod_sources=https://github.com/avie293/osmosis/
mod_issues=https://github.com/avie293/avie-issues/issues
java_version=25

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric - https://fabricmc.net/develop/
loom_version=1.19.4
fabric_loader_version=0.20.1
fabric_api_version=0.166.2+26.3

# NeoForge - https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.103
# https://projects.neoforged.net/neoforged/ModDevGradle
moddev_version=2.0.148

# Forge - https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=66.1.8
forge_loader_version=66
# https://plugins.gradle.org/plugin/net.minecraftforge.gradle
forgegradle_version=7.0.40
# https://maven.minecraftforge.net/net/minecraftforge/eventbus-validator/
forge_eventbus_validator_version=7.0.6
# Puts classes and resources into one output directory for the Forge dev runs.
net.minecraftforge.gradle.merge-source-sets=true

# Mixin (compile only in common, all loaders bundle these)
sponge_mixin_version=0.17.3+mixin.0.8.7
mixinextras_version=0.5.3

